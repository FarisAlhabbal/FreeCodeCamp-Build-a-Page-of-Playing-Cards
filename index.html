<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">

</head>

<body>
  <main id="playing-cards">

    <div class="card left">
      <div class="top-left">
        <p>A</p>
        <p>♠</p>
      </div>
      <div class="heart">
        <p>♠</p>
      </div>
      <div class="bottom-right">
                <p>♠</p>
                <p>A</p>
      </div>
    </div>


    <div class="card middle">

      <div class="top-left">
        <p>2</p>
        <p>♣</p>
      </div>
      <div class="heart">
        <p>♣</p>
        <p class="low-half">♣</p>
      </div>
      <div class="bottom-right">
                <p>♣</p>
                <p>2</p>
      </div>


    </div>
    <div class="card right">
      <div class="top-left">
        <p>3</p>
        <p>♥</p>
      </div>
      <div class="heart">
        <p>♥</p><p></p><p></p><p></p><p>♥</p>
        <p class="low-half">♥</p>
      </div>
      <div class="bottom-right">
                <p>♥</p>
                <p>3</p>
      </div>
    </div>

  </main>
</body>

</html>
